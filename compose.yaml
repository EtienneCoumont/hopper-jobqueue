# Development stack: PostgreSQL only. Run the API on the host, with hot reload:
#
#   docker compose up -d
#   export HOPPER_DB_CONNECTIONSTRING="Host=127.0.0.1;Port=5432;Database=hopper;Username=hopper;Password=hopper-dev"
#   dotnet watch --project src/HopperJobQueue.Api run --urls http://localhost:8080
#
# This file is for hacking on the code. To just *run* the service — locally or on a
# server, with no .NET SDK and no checkout — use deploy/standalone/ instead: two files
# and the prebuilt image (see the README quickstart).

name: hopper-jobqueue-dev

services:
  hopper-db:
    image: postgres:17
    environment:
      POSTGRES_DB: hopper
      POSTGRES_USER: hopper
      # Dev-only credentials; the port is bound to localhost.
      POSTGRES_PASSWORD: hopper-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hopper-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopper -d hopper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hopper-pgdata-dev:
