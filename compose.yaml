# Development stack: PostgreSQL only. Run the API on the host, with hot reload:
#
#   docker compose up -d
#   export HOPPER_DB_CONNECTIONSTRING="Host=127.0.0.1;Port=5432;Database=hopper;Username=hopper;Password=hopper-dev"
#   dotnet watch --project src/HopperJobQueue.Api run --urls http://localhost:8080
#
# No .NET SDK? `docker compose --profile try up -d` also starts the CI-published
# image on http://localhost:8080 — the full service, nothing to build.
#
# Production does not use this file: see deploy/ (a compose file to copy on the
# server next to a .env — no checkout, no build).

name: hopper-jobqueue-dev

services:
  hopper-db:
    image: postgres:17
    environment:
      POSTGRES_DB: hopper
      POSTGRES_USER: hopper
      # Dev-only credentials; the port is bound to localhost.
      POSTGRES_PASSWORD: hopper-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hopper-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopper -d hopper"]
      interval: 10s
      timeout: 5s
      retries: 5

  hopper:
    profiles: [try]
    image: ghcr.io/etiennecoumont/hopper-jobqueue:${HOPPER_IMAGE_TAG:-latest}
    environment:
      HOPPER_DB_CONNECTIONSTRING: Host=hopper-db;Port=5432;Database=hopper;Username=hopper;Password=hopper-dev
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      hopper-db:
        condition: service_healthy

volumes:
  hopper-pgdata-dev:
