# hopper-jobqueue derrière Traefik. Aucun port publié sur l'hôte : Traefik atteint
# le service par le réseau Docker, PostgreSQL reste sur le réseau interne.
# Variables attendues dans .env : voir .env.example.

services:
  hopper:
    image: hopper-jobqueue
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      HOPPER_DB_CONNECTIONSTRING: >-
        Host=hopper-db;Port=5432;Database=hopper;Username=hopper;Password=${HOPPER_DB_PASSWORD:?définir HOPPER_DB_PASSWORD dans .env}
      HOPPER_BOOTSTRAP_ADMIN_KEY: ${HOPPER_BOOTSTRAP_ADMIN_KEY:-}
      HOPPER_LOG_LEVEL: ${HOPPER_LOG_LEVEL:-Information}
    depends_on:
      hopper-db:
        condition: service_healthy
    # Marge supérieure au ShutdownTimeout d'ASP.NET (20 s) : le job HTTP en cours se termine.
    stop_grace_period: 30s
    networks:
      - traefik-public
      - hopper-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.hopper.loadbalancer.server.port=8080

      - traefik.http.routers.hopper-api.rule=Host(`${HOPPER_PUBLIC_HOST:-hopper.exemple.ch}`) && (PathPrefix(`/api`) || Path(`/healthz`) || Path(`/readyz`))
      - traefik.http.routers.hopper-api.entrypoints=websecure
      - traefik.http.routers.hopper-api.tls.certresolver=letsencrypt
      - traefik.http.routers.hopper-api.middlewares=hopper-buffer

      - traefik.http.routers.hopper-admin.rule=Host(`${HOPPER_PUBLIC_HOST:-hopper.exemple.ch}`) && (PathPrefix(`/admin`) || Path(`/admin.css`))
      - traefik.http.routers.hopper-admin.entrypoints=websecure
      - traefik.http.routers.hopper-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.hopper-admin.middlewares=hopper-admin-allow,hopper-buffer

      # /admin restreint par IP — défense supplémentaire, la clé admin reste requise derrière.
      - traefik.http.middlewares.hopper-admin-allow.ipallowlist.sourcerange=${HOPPER_ADMIN_IP_ALLOWLIST:?définir HOPPER_ADMIN_IP_ALLOWLIST dans .env}

      # Filet en amont des limites Kestrel (64 Ko / 512 Ko côté application).
      - traefik.http.middlewares.hopper-buffer.buffering.maxRequestBodyBytes=1048576

  hopper-db:
    # Version majeure épinglée : jamais `latest`. Un passage de majeure impose un
    # pg_upgrade ou un cycle dump/restore (voir README).
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hopper
      POSTGRES_USER: hopper
      POSTGRES_PASSWORD: ${HOPPER_DB_PASSWORD:?définir HOPPER_DB_PASSWORD dans .env}
    volumes:
      - hopper-pgdata:/var/lib/postgresql/data
    networks:
      - hopper-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopper -d hopper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hopper-pgdata:

networks:
  traefik-public:
    external: true
  hopper-internal:
