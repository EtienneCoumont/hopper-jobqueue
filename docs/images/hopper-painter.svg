<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="A night scene in the mood of an Edward Hopper painting: a lone figure in a lit diner window, waiting">
  <!-- Original illustration for hopper-jobqueue, an homage to Edward Hopper's mood
       (no painting is reproduced). Public domain (CC0). -->
  <rect x="0" y="0" width="640" height="420" rx="12" fill="#141f2b"/>

  <!-- distant skyline -->
  <g fill="#1a2735">
    <rect x="26" y="118" width="70" height="150"/>
    <rect x="104" y="88" width="54" height="180"/>
    <rect x="60" y="150" width="120" height="120"/>
  </g>
  <!-- a few sparse lit windows -->
  <g fill="#c9a95e" opacity="0.5">
    <rect x="118" y="104" width="8" height="10"/>
    <rect x="134" y="132" width="8" height="10"/>
    <rect x="40" y="140" width="8" height="10"/>
  </g>

  <!-- diner building -->
  <rect x="196" y="96" width="418" height="212" fill="#24423b"/>
  <rect x="196" y="96" width="418" height="26" fill="#182e29"/>
  <rect x="196" y="286" width="418" height="22" fill="#1b332d"/>

  <!-- vertical OPEN sign -->
  <rect x="206" y="130" width="34" height="128" rx="4" fill="#7e2f26"/>
  <g fill="#f5dfae" font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle">
    <text x="223" y="156">O</text>
    <text x="223" y="186">P</text>
    <text x="223" y="216">E</text>
    <text x="223" y="246">N</text>
  </g>

  <!-- the big lit window -->
  <rect x="258" y="130" width="332" height="150" rx="3" fill="#f2d488"/>
  <rect x="252" y="124" width="344" height="162" rx="4" fill="none" stroke="#cfc3a0" stroke-width="6"/>
  <!-- interior back wall band -->
  <rect x="258" y="130" width="332" height="44" fill="#e4bf6d"/>
  <!-- pendant lamps -->
  <g>
    <line x1="340" y1="130" x2="340" y2="150" stroke="#8a6d33" stroke-width="3"/>
    <line x1="470" y1="130" x2="470" y2="150" stroke="#8a6d33" stroke-width="3"/>
    <circle cx="340" cy="156" r="8" fill="#fff3cd"/>
    <circle cx="470" cy="156" r="8" fill="#fff3cd"/>
  </g>
  <!-- counter -->
  <path d="M 258 236 L 590 236 L 590 252 L 258 252 Z" fill="#9a5b3c"/>
  <rect x="258" y="252" width="332" height="28" fill="#7c4630"/>
  <!-- coffee urns at the far end -->
  <g fill="#b8b0a0">
    <rect x="540" y="196" width="16" height="40" rx="3"/>
    <rect x="562" y="200" width="14" height="36" rx="3"/>
  </g>
  <!-- the lone figure, back turned, waiting -->
  <g fill="#2c2a26">
    <circle cx="392" cy="196" r="13"/>
    <path d="M 372 240 Q 372 210 392 210 Q 412 210 412 240 Z"/>
  </g>
  <!-- hat brim -->
  <ellipse cx="392" cy="188" rx="16" ry="4" fill="#211f1c"/>
  <!-- coffee cup on the counter -->
  <g>
    <rect x="416" y="226" width="12" height="9" rx="2" fill="#f7f1df"/>
    <path d="M 428 228 q 6 2 0 5" stroke="#f7f1df" stroke-width="2" fill="none"/>
  </g>
  <!-- window mullion -->
  <rect x="332" y="174" width="5" height="106" fill="#cfc3a0"/>
  <rect x="482" y="174" width="5" height="106" fill="#cfc3a0"/>

  <!-- street lamp -->
  <g>
    <line x1="120" y1="160" x2="120" y2="330" stroke="#0e1620" stroke-width="7"/>
    <path d="M 120 160 q 0 -18 20 -18 l 8 0" stroke="#0e1620" stroke-width="6" fill="none"/>
    <circle cx="152" cy="142" r="7" fill="#f2d488"/>
    <path d="M 152 150 L 122 330 L 182 330 Z" fill="#f2d488" opacity="0.12"/>
  </g>

  <!-- sidewalk and pooled light -->
  <rect x="0" y="308" width="640" height="112" fill="#22303c"/>
  <rect x="0" y="308" width="640" height="8" fill="#2c3b48"/>
  <ellipse cx="424" cy="330" rx="190" ry="17" fill="#f2d488" opacity="0.14"/>
  <ellipse cx="152" cy="332" rx="34" ry="8" fill="#f2d488" opacity="0.16"/>
</svg>
