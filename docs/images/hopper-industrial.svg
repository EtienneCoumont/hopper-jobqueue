<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="An industrial hopper: jobs tumble in at the top in bulk and leave one at a time on a conveyor belt">
  <!-- Original illustration for hopper-jobqueue. Public domain (CC0). -->
  <rect x="0" y="0" width="640" height="420" rx="12" fill="#e9eef3"/>

  <!-- jobs tumbling in (dashboard status palette) -->
  <g stroke="#3d4650" stroke-width="1.5">
    <rect x="238" y="26" width="20" height="20" rx="4" fill="#b7791f" transform="rotate(18 248 36)"/>
    <rect x="300" y="14" width="20" height="20" rx="4" fill="#145a8a" transform="rotate(-24 310 24)"/>
    <rect x="362" y="30" width="20" height="20" rx="4" fill="#1d7a3a" transform="rotate(32 372 40)"/>
    <rect x="270" y="60" width="20" height="20" rx="4" fill="#8a5a9e" transform="rotate(-12 280 70)"/>
    <rect x="336" y="66" width="20" height="20" rx="4" fill="#a4262c" transform="rotate(9 346 76)"/>
    <rect x="402" y="58" width="20" height="20" rx="4" fill="#b7791f" transform="rotate(-30 412 68)"/>
    <rect x="214" y="64" width="20" height="20" rx="4" fill="#145a8a" transform="rotate(40 224 74)"/>
  </g>

  <!-- support frame -->
  <g stroke="#5c6773" stroke-width="10" stroke-linecap="round">
    <line x1="196" y1="130" x2="150" y2="330"/>
    <line x1="444" y1="130" x2="490" y2="330"/>
  </g>

  <!-- hopper funnel -->
  <path d="M 180 122 L 460 122 L 344 268 L 296 268 Z" fill="#93a0ad" stroke="#5c6773" stroke-width="3"/>
  <path d="M 180 122 L 460 122 L 431 158 L 209 158 Z" fill="#7e8b98"/>
  <rect x="168" y="106" width="304" height="18" rx="4" fill="#5c6773"/>
  <!-- rivets -->
  <g fill="#4a5560">
    <circle cx="206" cy="146" r="3"/><circle cx="254" cy="146" r="3"/><circle cx="302" cy="146" r="3"/>
    <circle cx="350" cy="146" r="3"/><circle cx="398" cy="146" r="3"/><circle cx="434" cy="146" r="3"/>
    <circle cx="238" cy="210" r="3"/><circle cx="286" cy="210" r="3"/><circle cx="334" cy="210" r="3"/>
    <circle cx="382" cy="210" r="3"/>
  </g>
  <!-- chute and gate -->
  <rect x="296" y="268" width="48" height="30" fill="#7e8b98" stroke="#5c6773" stroke-width="3"/>
  <rect x="288" y="296" width="64" height="10" rx="3" fill="#4a5560"/>

  <!-- one job falling out of the chute -->
  <rect x="310" y="316" width="20" height="20" rx="4" fill="#1d7a3a" stroke="#3d4650" stroke-width="1.5"/>

  <!-- conveyor belt -->
  <rect x="118" y="352" width="444" height="22" rx="11" fill="#4a5560"/>
  <circle cx="132" cy="363" r="7" fill="#2f3843"/>
  <circle cx="548" cy="363" r="7" fill="#2f3843"/>
  <!-- jobs leaving in single file -->
  <g stroke="#3d4650" stroke-width="1.5">
    <rect x="380" y="330" width="20" height="20" rx="4" fill="#b7791f"/>
    <rect x="444" y="330" width="20" height="20" rx="4" fill="#145a8a"/>
    <rect x="508" y="330" width="20" height="20" rx="4" fill="#8a5a9e"/>
  </g>
  <!-- direction chevrons -->
  <g stroke="#8d99a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 576 344 l 10 10 l -10 10"/>
    <path d="M 592 344 l 10 10 l -10 10"/>
  </g>

  <!-- ground -->
  <line x1="96" y1="392" x2="560" y2="392" stroke="#c6cfd8" stroke-width="4" stroke-linecap="round"/>
</svg>
